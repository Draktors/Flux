query($q:String!){ search(query:$q,type:ISSUE,first:50){ nodes{ ... on PullRequest{
  number title url state isDraft updatedAt mergedAt closedAt headRefName reviewDecision mergeStateStatus
  repository{name} author{login}
  viewerLatestReview{state submittedAt}
  viewerLatestReviewRequest{id}
  timelineItems(last:3,itemTypes:[REVIEW_REQUESTED_EVENT]){nodes{... on ReviewRequestedEvent{createdAt requestedReviewer{... on User{login}}}}}
  commits(last:1){nodes{commit{committedDate statusCheckRollup{state}}}}
  reviews(first:5,states:PENDING){nodes{author{login} createdAt updatedAt comments{totalCount}}}
  reviewThreads(first:60){nodes{isResolved isOutdated first:comments(first:1){nodes{author{login}}} last:comments(last:1){nodes{author{login} createdAt}}}}
}}}}
